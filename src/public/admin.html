<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель администратора</title>
    <link rel="stylesheet" href="./css/style.css">
    <style>
        .status-select {
            padding: 5px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        .status-new { background-color: #fff3cd; color: #856404; }
        .status-assigned { background-color: #d4edda; color: #155724; }
        .status-completed { background-color: #d1ecf1; color: #0c5460; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #667eea;
            color: white;
        }
        .nav-links {
            display: flex;
            gap: 20px;
            justify-content: flex-end;
            margin-bottom: 20px;
        }
        .nav-links a {
            text-decoration: none;
            color: #667eea;
            font-weight: bold;
        }
        h2 {
            margin-bottom: 20px;
        }
         @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }
            h2 {
                font-size: 1.2rem;
            }
            h3 {
                font-size: 1rem;
            }
            .nav-links {
                gap: 10px;
                justify-content: center;
                margin-bottom: 15px;
            }
            .nav-links a {
                font-size: 14px;
            }
            th, td {
                padding: 8px 6px;
                font-size: 12px;
            }
            .status-select {
                padding: 3px 5px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-links">
            <a href="./dashboard.html">Личный кабинет</a>
            <a href="#" id="logoutBtn">Выйти</a>
        </div>
        <h2>Панель администратора</h2>
        <h3>Все заявки</h3>
        <div style="overflow-x: auto;">
            <table id="adminBookingsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Пользователь</th>
                        <th>Помещение</th>
                        <th>Дата</th>
                        <th>Оплата</th>
                        <th>Статус</th>
                        <th>Действие</th>
                    </tr>
                </thead>
                <tbody id="adminBookingsList"></tbody>
            </table>
        </div>
    </div>
    <script src="./js/common.js"></script>
    <script src="./js/admin.js"></script>
</body>
</html>
